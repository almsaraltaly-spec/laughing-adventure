<title>Tycoon City</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Cairo:wght@600;800;900&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one portrait phone column. Top = player strip, middle = camera-driven board viewport, bottom = action panel. Sheets slide up over it. */
:root{--felt:#0b3a36;--felt2:#061f1d;--cream:#f2edd8;--ink:#1a1f26;--gold:#f4b63a;--gold-d:#a56f12;--red:#d93f2e;--navy:#10203a;--navy2:#1b3157;--ok:#33c27a;--bad:#ff5a4a;--fd:'Alfa Slab One','Rockwell',Georgia,serif;--fb:'Nunito',system-ui,-apple-system,sans-serif;color-scheme:dark}
html[lang=ar]{--fd:'Cairo',system-ui,sans-serif;--fb:'Cairo',system-ui,sans-serif}
[hidden]{display:none!important}
[data-money]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--felt2);color:#fff;font-family:var(--fb);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--felt);box-shadow:0 0 60px #000a}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}
.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:900;font-size:16px;letter-spacing:.2px;background:var(--gold);color:#2a1a00;box-shadow:0 5px 0 var(--gold-d),0 9px 14px #0006;transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.btn.dark{background:var(--navy2);color:#fff;box-shadow:0 5px 0 #0a1630,0 9px 14px #0006}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 #8a2218}
.btn.green{background:var(--ok);color:#052b17;box-shadow:0 5px 0 #17724a}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--gold-d)}
.btn[disabled]{filter:grayscale(1) brightness(.7);pointer-events:none}
.ibtn{width:46px;height:46px;border-radius:14px;border:0;background:var(--navy2);color:#fff;font-size:21px;box-shadow:0 4px 0 #0a1630;display:grid;place-items:center;position:relative}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1630}
.ibtn[disabled]{opacity:.35;pointer-events:none}
/* HOME */
#home{align-items:center;justify-content:center;gap:14px;padding:20px;background:radial-gradient(circle at 50% 30%,#14665c,var(--felt) 55%,var(--felt2));overflow:hidden}
#home .bgtiles{position:absolute;inset:-20%;background:repeating-linear-gradient(45deg,#ffffff08 0 40px,transparent 40px 80px);transform:rotate(8deg)}
.fl{position:absolute;font-size:34px;animation:flo 6s ease-in-out infinite;opacity:.55}
@keyframes flo{50%{transform:translateY(-22px) rotate(14deg)}}
.logo{font-family:var(--fd);font-size:54px;line-height:.95;text-align:center;color:var(--gold);text-shadow:0 2px 0 #b57a14,0 4px 0 #8a5a0c,0 6px 0 #5e3b06,0 12px 20px #000a;letter-spacing:1px;transform:rotate(-3deg);z-index:1}
.logo small{display:block;font-size:22px;color:#fff;letter-spacing:6px;text-shadow:0 3px 0 #0006;margin-top:6px}
.stripe{display:flex;width:210px;height:12px;border-radius:6px;overflow:hidden;z-index:1;box-shadow:0 3px 0 #0006}.stripe i{flex:1}
.tag{z-index:1;opacity:.85;text-align:center;font-weight:800;margin:0}
.menu{display:flex;flex-direction:column;gap:12px;width:min(300px,100%);z-index:1;margin-top:6px}
.langs{position:absolute;top:calc(12px);inset-inline:12px;display:flex;justify-content:space-between;z-index:2}
.seg{display:flex;background:#0006;border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:#fff;border-radius:9px;padding:7px 11px;font-weight:900;font-size:13px}
.seg button.on{background:var(--gold);color:#2a1a00}
/* PAGES (setup/settings/rules) */
.page{padding:14px;gap:12px;background:linear-gradient(var(--felt),var(--felt2));overflow:auto}
.page h2{font-family:var(--fd);font-weight:400;color:var(--gold);margin:0;font-size:26px;text-shadow:0 3px 0 #0006}
.top{display:flex;align-items:center;gap:10px}
.card{background:#0a2a2755;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lbl{font-weight:900;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;opacity:.75}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slot{display:flex;gap:8px;align-items:center;padding:8px;border-radius:16px;background:#0007;border:2px solid var(--c,#fff3)}
.slot.off{opacity:.45}
.slot .tkb{width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:var(--c);font-size:26px;display:grid;place-items:center;flex:none}
.slot input{flex:1;min-width:0;background:#0008;border:1px solid var(--line);border-radius:10px;color:#fff;padding:10px;font:800 15px var(--fb)}
.rules p{margin:6px 0;line-height:1.45}.rules b{color:var(--gold)}
/* GAME */
#hud{display:flex;gap:6px;padding:8px 8px 6px;background:linear-gradient(#0a1830,#10203a)}
.pc{flex:1;min-width:0;border-radius:12px;padding:5px 6px;background:#ffffff12;border:2px solid transparent;display:flex;flex-direction:column;gap:1px;position:relative;transition:.25s}
.pc.act{border-color:var(--c);background:#ffffff26;box-shadow:0 0 14px var(--c);transform:translateY(-2px)}
.pc.out{opacity:.35;filter:grayscale(1)}
.pc .n{display:flex;align-items:center;gap:4px;font-weight:900;font-size:12px;white-space:nowrap;overflow:hidden}
.pc .n i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:12px;flex:none;border:1.5px solid #fff}
.pc .n span{overflow:hidden;text-overflow:ellipsis}
.pc .m{font-weight:900;font-size:15px;color:var(--gold2);font-variant-numeric:tabular-nums}
.pc .dots{display:flex;gap:2px;flex-wrap:wrap;min-height:6px}.pc .dots b{width:7px;height:7px;border-radius:2px}
.pc .fm{position:absolute;inset-inline:0;top:-4px;text-align:center;font-weight:900;font-size:15px;pointer-events:none;animation:fm 1.3s forwards;z-index:9;text-shadow:0 2px 3px #000}
@keyframes fm{to{transform:translateY(34px);opacity:0}}
#vp{-webkit-touch-callout:none;position:relative;flex:1;min-height:0;overflow:hidden;perspective:1500px;direction:ltr;background:radial-gradient(circle at 50% 50%,#17756a,#0b3a36 60%,#061f1d);touch-action:none}
#world{position:absolute;left:0;top:0;width:980px;height:980px;transform-origin:50% 50%;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
#world.nt{transition:none}
.board{position:absolute;inset:-14px;border-radius:26px;background:#2a2118;box-shadow:0 30px 60px #000a,0 0 0 4px #5b4527}
.felt{position:absolute;inset:130px;background:linear-gradient(135deg,#cfe8cb,#b6dbb4);border:2px solid #20321f;overflow:hidden}
.felt .lg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-38deg);font-family:var(--fd);font-size:110px;line-height:.9;text-align:center;color:#d93f2e;text-shadow:0 6px 0 #8a2218,0 12px 18px #0005;white-space:nowrap;border:10px solid #d93f2e;padding:22px 30px;background:#fff3;border-radius:14px}
.felt .lg small{display:block;font-size:34px;letter-spacing:12px;color:#1a1f26;text-shadow:none;margin-top:8px}
.deck{position:absolute;width:150px;height:96px;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:25px;color:#fff;border:4px solid #fff;box-shadow:4px 4px 0 #0004,8px 8px 0 #0003}
.t{position:absolute;border:1.5px solid #20321f;background:var(--cream);overflow:hidden}
.t.cn{background:#e8e2c8}
.ti{position:absolute;left:50%;top:50%;margin:-65px 0 0 -40px;width:80px;height:130px;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--ink);font-weight:900;font-size:12.5px;line-height:1.05}
.bar{width:100%;height:27px;border-bottom:1.5px solid #20321f;display:flex;align-items:center;justify-content:center;gap:2px;flex:none}
.h{width:11px;height:15px;background:#2fb457;border:1.5px solid #0d4a22;border-radius:2px}.H{width:36px;height:15px;background:#d6322b;border:1.5px solid #6a100b;border-radius:3px}
.nm{padding:5px 3px 0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;width:100%}.nm .ic{font-size:30px;line-height:1}
.pr{padding-bottom:4px;font-size:12px;font-weight:900}
.ow{position:absolute;left:0;right:0;bottom:0;height:19px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:900}
.t.mort .ti{filter:grayscale(1) opacity(.55)}.t.mort::after{content:"M";position:absolute;inset:0;display:grid;place-items:center;font:900 64px var(--fd);color:#d93f2e88;pointer-events:none}
.cnb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-weight:900;color:var(--ink);font-size:15px;line-height:1.05}
.cnb .big{font-family:var(--fd);font-size:34px;line-height:1}.cnb .em{font-size:44px;line-height:1}
.jailbox{position:absolute;right:6px;top:6px;width:80px;height:80px;border:3px solid #20321f;background:repeating-linear-gradient(90deg,#f6a21e 0 12px,#20321f 12px 15px)}
.tk{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;transform-origin:50% 100%;transform:rotateZ(calc(var(--rz,0deg)*-1)) rotateX(calc(var(--ta,0deg)*-1));transition:left .22s linear,top .22s linear,transform .6s;z-index:5}
.tki{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:23px;border:3px solid #fff;background:var(--c);box-shadow:0 6px 0 #0005,0 10px 12px #0006}
.tk.act{z-index:6}.tk.act .tki{animation:bob .9s ease-in-out infinite}.tk.hop .tki{animation:hop .22s}
@keyframes bob{50%{transform:translateY(-7px)}}@keyframes hop{50%{transform:translateY(-18px) scale(1.15)}}
.tk.gone{display:none}
#dice{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:30px;perspective:600px;z-index:8;pointer-events:none}
.die{width:50px;height:50px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.face{position:absolute;inset:0;background:#fff;border-radius:10px;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-shadow:inset 0 0 8px #0004;backface-visibility:hidden}
.face .pip{width:10px;height:10px;border-radius:50%;background:#14181d;place-self:center}.face.f1 .pip{background:#d33;width:13px;height:13px}
.f1{transform:translateZ(25px)}.f6{transform:rotateY(180deg) translateZ(25px)}.f2{transform:rotateY(90deg) translateZ(25px)}.f5{transform:rotateY(-90deg) translateZ(25px)}.f3{transform:rotateX(90deg) translateZ(25px)}.f4{transform:rotateX(-90deg) translateZ(25px)}
#cap{position:absolute;inset-inline:10px;top:8px;text-align:center;font-weight:900;font-size:15px;padding:9px 14px;border-radius:14px;background:#0a1830e8;border:1px solid #fff3;color:#fff;pointer-events:none;opacity:0;transform:translateY(-10px);transition:.3s;z-index:9;direction:inherit}
#cap.on{opacity:1;transform:none}
#camBtns{position:absolute;inset-inline-end:8px;top:64px;display:flex;flex-direction:column;gap:8px;z-index:9}
#camBtns .ibtn{width:42px;height:42px;font-size:18px;background:#0a1830dd}
#panel{padding:8px 10px 10px;background:linear-gradient(#10203a,#0a1830);border-top:3px solid var(--gold);display:flex;flex-direction:column;gap:8px}
#status{font-weight:800;font-size:14px;min-height:20px;text-align:center;opacity:.95}
#acts{display:flex;gap:8px;align-items:center}
@keyframes pls{50%{transform:scale(1.04)}}
/* SHEET */
#sheet{position:absolute;inset:0;background:#030a1499;display:none;align-items:flex-end;z-index:50}
#sheet.open{display:flex}
#sheetBody{width:100%;max-height:90%;overflow:auto;background:linear-gradient(#1a4470,#0b2040);color:#fff;border-top:3px solid var(--gold);border-radius:24px 24px 0 0;padding:16px 16px 22px;animation:rise .28s cubic-bezier(.2,.8,.2,1);-webkit-user-select:text;user-select:text}
@keyframes rise{from{transform:translateY(60%);opacity:0}}
#sheetBody h3{font-family:var(--fd);font-weight:400;margin:0 0 8px;font-size:22px}
.brow{display:flex;gap:8px;margin-top:12px}.brow .btn{flex:1;padding:12px 8px;font-size:15px}
.deed{border:2px solid var(--ink);background:#fff;border-radius:6px;text-align:center;padding-bottom:10px;margin:0 auto;max-width:300px}
.deed .hd{padding:10px 6px;border-bottom:2px solid var(--ink)}.deed .hd small{display:block;font-weight:900;font-size:10px;letter-spacing:1.5px}.deed .hd b{font:400 20px var(--fd)}
.deed,.deed table,.deed td{color:#1a1f26}
.deed table{width:88%;margin:8px auto;border-collapse:collapse;font-weight:800;font-size:14px}.deed td{padding:2px 0;text-align:start}.deed td+td{text-align:end}
.deed .ft{font-size:12px;font-weight:800;opacity:.8;line-height:1.5}
.row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #0002;font-weight:800;font-size:14px}
.row .sw{width:14px;height:30px;border-radius:4px;flex:none;border:1.5px solid #0006}.row .g{flex:1;min-width:0}.row .g small{display:block;font-weight:700;opacity:.7}
.row .ib{display:flex;gap:5px}
.sq{width:38px;height:38px;border-radius:11px;border:2px solid var(--ink);background:var(--gold);font-size:17px;font-weight:900;display:grid;place-items:center;padding:0}.sq[disabled]{opacity:.25}.sq.alt{background:#cfd8e6}.sq.bad{background:#ff8d80}
.chip{padding:7px 11px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-weight:900;font-size:13px;color:var(--ink)}.chip.on{background:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>div{border:2px solid #0003;border-radius:14px;padding:8px;min-width:0}
.two h4{margin:0 0 6px;font-size:13px}
.step{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:6px 0}.step b{font-size:17px;font-variant-numeric:tabular-nums}
.cardx{perspective:900px;margin:8px auto;width:min(280px,100%)}
.cardx>div{border-radius:16px;padding:22px 18px;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;font-weight:900;font-size:17px;color:#fff;border:5px solid #fff;box-shadow:0 14px 26px #0006;animation:flip .7s}
@keyframes flip{from{transform:rotateY(90deg) scale(.7)}}
.cardx .q{font-family:var(--fd);font-size:44px}
.big{font-family:var(--fd);font-size:34px}
#banner{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#030a14d9;text-align:center;padding:20px}
#banner.on{display:flex}
#banner .tkb{width:90px;height:90px;border-radius:50%;border:5px solid #fff;font-size:50px;display:grid;place-items:center;background:var(--c);animation:bob 1s infinite}
#banner h2{font-family:var(--fd);font-weight:400;font-size:30px;margin:0;color:var(--gold)}
.cf{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards;z-index:80}
@keyframes fall{to{transform:translateY(900px) rotate(720deg)}}
.muted{opacity:.65;font-weight:700;font-size:13px}

/* v2 usability layer */
#sheetBody .rules b{color:#a56f12}#sheetBody .rules p{margin:8px 0;line-height:1.5;font-size:14.5px}
#acts{align-items:flex-start}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;width:58px;flex:none;background:none;border:0;color:#fff;font-weight:800;font-size:11px;padding:0;position:relative}
.sb .ibtn{width:52px;height:46px}.sb:active .ibtn{transform:translateY(3px);box-shadow:0 1px 0 #0a1630}
.sb .sl{white-space:nowrap;opacity:.9;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.sb[disabled]{opacity:.35;pointer-events:none}
.sb.badge .ibtn::after{content:"";position:absolute;top:-4px;inset-inline-end:2px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid #fff;animation:pls 1s infinite}
#status .rd{opacity:.7;font-size:12px;font-weight:800;margin-inline-start:2px}
#status{display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;min-height:24px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;flex:none}
#dice{pointer-events:auto;cursor:pointer}
#rollres{position:absolute;inset-inline:0;top:42%;text-align:center;font-family:var(--fd);font-size:64px;color:#fff;text-shadow:0 4px 0 #0008,0 0 24px #000;pointer-events:none;opacity:0;z-index:9}
#rollres.on{animation:rr 1.5s forwards}
#rollres small{display:block;font-size:26px;color:var(--gold)}
@keyframes rr{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.pc .m{font-size:17px}.pc{padding:6px 7px}
.pc .n b{margin-inline-start:auto;font-size:11px}
.ti{font-size:13.5px}.ti.lg{font-size:11px}.nm span{overflow-wrap:anywhere}
.ow{height:21px;font-size:15px}
.gh{display:flex;align-items:center;gap:8px;margin-top:12px;padding-bottom:4px;border-bottom:3px solid;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.gh i{width:14px;height:14px;border-radius:4px;border:1.5px solid #0006}.gh small{margin-inline-start:auto;opacity:.7;font-size:12px}
.prow{padding:8px 2px;border-bottom:1px solid #0002;display:flex;flex-direction:column;gap:6px}
.prow .nmr{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:15px}.prow .nmr small{font-weight:700;opacity:.7}
.prow .ab-w{display:flex;gap:6px;flex-wrap:wrap}
.ab{padding:9px 11px;border-radius:11px;border:2px solid var(--ink);font-weight:900;font-size:13px;background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #0003}
.ab.alt{background:#cfd8e6}.ab.bad{background:#ffb3a8}.ab[disabled]{opacity:.3;box-shadow:none}
.hintx{font-size:12px;font-weight:700;opacity:.7}
details.card summary{font-weight:900;cursor:pointer;list-style:none;padding:2px}
details.card summary::before{content:"⚙️ "}
.home-quick{font-size:22px;padding:18px;box-shadow:0 6px 0 var(--gold-d),0 12px 20px #0007}

/* v3: centre card, effects, accessibility */
#pop{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle,#0007,#000d);padding:16px}
#pop.on{display:flex}
.pcard{width:min(255px,72vw);animation:pull .6s cubic-bezier(.2,.9,.25,1.1);transform-origin:50% 100%}
@keyframes pull{from{transform:translateY(46vh) scale(.25) rotate(-14deg);opacity:0}55%{opacity:1}}
.pbtns{display:flex;gap:12px;width:min(310px,100%)}.pbtns .btn{flex:1;padding:15px 8px;font-size:17px}
.pcard .deed{box-shadow:0 20px 34px #000a;border-radius:12px;font-size:13px}
.pcard .deed .hd{border-radius:10px 10px 0 0}
.lblc{text-align:center;font-family:var(--fd);font-size:22px;color:var(--gold);margin-bottom:10px}
.t.fx::before{content:"";position:absolute;inset:0;border:8px solid var(--fxc,#fff);z-index:4;pointer-events:none;animation:ring .8s ease-out 3}
@keyframes ring{from{opacity:1;transform:scale(1.3)}to{opacity:0;transform:scale(.8)}}
.tfo{position:absolute;width:0;height:0;transform-origin:50% 100%;transform:rotateZ(calc(var(--rz,0deg)*-1)) rotateX(calc(var(--ta,0deg)*-1));z-index:9;pointer-events:none}
.tf{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:400 32px var(--fd);color:var(--c,#fff);text-shadow:0 3px 0 #000,0 0 10px #000;white-space:nowrap;pointer-events:none;z-index:9;animation:tfl 1.7s ease-out forwards}

rulesT:"<p><b>Goal.</b> Be the last player with money. Buy properties, collect rent, build houses and hotels, and push everyone else into bankruptcy.</p><p><b>Your turn.</b> Roll two dice and move clockwise. Doubles give you another roll. Three doubles in a row send you to jail.</p><p><b>Squares.</b> Unowned property: buy it at the printed price, or it goes to auction. Owned property: pay rent to the owner. Passing or landing on GO pays $200. Chance and Community Chest draw a card. Taxes go to the bank (or the Free Parking jackpot if enabled).</p><p><b>Sets.</b> Own every property of one colour and you double the base rent and can build. Build evenly: one house on each property before a second. Four houses upgrade to a hotel. Railways pay more for each one owned. Utilities pay 4 or 10 times the dice.</p><p><b>Jail.</b> Leave by paying $50, using a Get Out of Jail Free card, or rolling doubles. After three failed turns you pay $50 and move. You still collect rent while in jail.</p><p><b>Money trouble.</b> Mortgage properties for half their price (no buildings on the set), or sell buildings for half the cost. Unmortgaging costs the loan plus 10%. If you cannot pay, you are bankrupt and your assets go to the creditor.</p><p><b>Trading.</b> Trade properties, cash and jail cards with anyone, but not properties whose colour set has buildings.</p><p><b>Modes.</b> Play against up to 3 computer players or pass the phone between friends on the same device.</p><p><b>Scenarios.</b> Before a match pick a scenario (Sprint, Hard Times, Land Rush, Wild Market…) or build your own rules: start cash, GO bonus, prices, rents, building cost, taxes, round limit and more. The computer players adapt their strategy to the chosen rules.</p><p><b>Tip.</b> Press and hold any money amount to hear its owner and its current value.</p>",

 if(G.opt.diff==="easy"&&Math.random()<.35)return false;return p.cash>=t.p+(t.t==="prop"?r:r/2)}
function aiJail(p){if(p.jc.length)return"card";if(p.cash>400&&G.owner.filter(o=>o<0).length>8)return"pay";return"roll"}
function aiRaise(p,amt){for(let g=0;p.cash<amt&&g<300;g++){const m=mineOf(p),mo=m.filter(i=>canMort(p,i)).sort((a,b)=>{const sa=TL[a].t==="prop"&&ownsAll(p,TL[a].g)?1:0,sb=TL[b].t==="prop"&&ownsAll(p,TL[b].g)?1:0;return sa-sb||TL[a].p-TL[b].p});
  if(mo.length){doMort(p,mo[0]);continue}const se=m.filter(i=>canSell(p,i)).sort((a,b)=>G.houses[b]-G.houses[a]);if(se.length){doSell(p,se[0]);continue}break}return p.cash>=amt}
async function aiManage(p,trade){if(p.bankrupt)return;const r=aiRes();let n=0;
 for(const i of mineOf(p).filter(i=>G.mort[i]).sort((a,b)=>TL[b].p-TL[a].p)){if(p.cash-unCost(i)>=r+150&&canUnmort(p,i)){doUnmort(p,i);await said();await sleep(150)}}
 const maxB=G.sc&&G.sc.build<1?8:5;for(let g=0;g<30&&n<maxB;g++){let best=-1;const c=[];for(let gi=7;gi>=0;gi--){if(!ownsAll(p,gi))continue;GT[gi].forEach(i=>{if(canBuild(p,i)&&p.cash-TL[i].h>=r)c.push(i)});if(c.length)break}
  if(!c.length)break;c.sort((a,b)=>G.houses[a]-G.houses[b]);doBuild(p,c[0]);n++;await said();await sleep(200)}
 if(trade&&!p.bankrupt)await aiTradeOffer(p)}

function nearSets(p){const r=[];GR.forEach((_,g)=>{const L=GT[g],mine=L.filter(i=>G.owner[i]===p.id),miss=L.filter(i=>G.owner[i]!==p.id);if(!mine.length||!miss.length||miss.length>2)return;const ow=G.owner[miss[0]];if(ow<0||ow===p.id||!miss.every(i=>G.owner[i]===ow))return;const q=G.players[ow];if(q.bankrupt||!miss.every(i=>tradable(q,i)))return;r.push({g,miss,q})});return r}
function spareOf(p){const rl=RAILS.filter(i=>G.owner[i]===p.id).length;return mineOf(p).filter(i=>{if(!tradable(p,i))return false;const t=TL[i];if(t.t==="prop"){const n=GT[t.g].filter(j=>G.owner[j]===p.id).length;return n<2&&!G.houses[i]}if(t.t==="rail")return rl<3;return true})}
function aiDeals(p){const out=[],c=ctxFor(p),sp=spareOf(p),cashMax=Math.floor((p.cash-Math.max(60,c.R*.35))/10)*10;
 const slk=Math.random()*.2*({easy:1.4,normal:1,hard:.6}[G.opt.diff]||1)*(persOf(p).greed>.1?1.3:1);
 const test=x=>{if(x.give.cash>cashMax&&x.give.cash>0)return;const d=decide(x,{noNoise:true,noCtr:true});if(d.S-d.need<-slk*d.gv||d.an.cashA<0)return;const an=d.an;if(an.da<8)return;out.push({x,da:an.da,pred:d.S-d.need})};
 for(const ns of nearSets(p)){const q=ns.q,base=ns.miss.reduce((s,i)=>s+TL[i].p,0),get={cash:0,props:ns.miss,jc:0};
  [1,1.35,1.8,2.4,3.2].forEach(m=>{const cash=Math.round(base*m/10)*10;if(cash<=cashMax)test({from:p,to:q,give:{cash,props:[],jc:0},get})});
  sp.filter(j=>!ns.miss.includes(j)).sort((a,b)=>TL[b].p-TL[a].p).slice(0,6).forEach(j=>[0,.5,1].forEach(m=>{const cash=Math.round(base*m/10)*10;if(cash<=Math.max(0,cashMax))test({from:p,to:q,give:{cash,props:[j],jc:0},get})}))}
 if(p.cash<c.R*.9&&sp.length>=2){alive().filter(q=>q!==p&&q.cash>300).forEach(q=>sp.slice().sort((a,b)=>TL[b].p-TL[a].p).slice(0,3).forEach(j=>[1.25,1,.8].forEach(m=>{const ask=Math.round(TL[j].p*m/10)*10;if(q.cash-ask>=150)test({from:p,to:q,give:{cash:0,props:[j],jc:0},get:{cash:ask,props:[],jc:0}})})))}
 if(!out.length&&G.opt.diff==="easy"){const ns=nearSets(p)[0];if(ns){const base=ns.miss.reduce((s,i)=>s+TL[i].p,0),cash=Math.round(base*1.4/10)*10;if(cash<=cashMax)out.push({x:{from:p,to:ns.q,give:{cash,props:[],jc:0},get:{cash:0,props:ns.miss,jc:0}},da:0})}}
 return out.sort((a,b)=>b.da-a.da)}
async function aiTradeOffer(p){if(p.tcd>0){p.tcd--;return}const dif=DIFFT[G.opt.diff]||DIFFT.normal;if(Math.random()>dif.find)return;const ds=aiDeals(p);if(!ds.length)return;const d=ds[0];if(!d.x.to.ai&&Math.random()>.55)return;
 const ok=await proposeTrade(d.x);p.tcd=ok?1:(G.opt.diff==="hard"?2:4)+rnd(3)}

 else if(k==="lands"){h=`<h3>🗺️ ${tr("mLands")}</h3>`;const grp=(nm,col,L)=>`<div class="gh" style="border-color:${col}"><i style="background:${col}"></i>${nm}</div><div class="mcs">${L.map(miniCard).join("")}</div>`;GR.forEach((g,gi)=>h+=grp(tb("g")[gi],g.c,GT[gi]));h+=grp(tb("rails"),"#222",RAILS)+grp(tb("utils"),"#bbb",UTILS)}
 else if(k==="cards"){const dk=(ty,L,nm)=>`<div class="gh" style="border-color:${ty==="chance"?"#f08a24":"#2f7de1"}"><i style="background:${ty==="chance"?"#f08a24":"#2f7de1"}"></i>${nm}<small>${G.decks[ty].length} ${tr("cardsLeft")}</small></div>`+L.map(c=>`<div class="row" style="font-weight:700;font-size:13px">${esc(fmt(c[2+BI()],{n:c[0]==="go"?tn(c[1]):"",go:GOB()}))}</div>`).join("");h=`<h3>🃏 ${tr("mCards")}</h3>`+dk("chance",CH,tb("chance"))+dk("chest",CC,tb("chest"))}
 else if(k==="bal"){h=`<h3>💰 ${tr("mBal")}</h3>`+G.players.map(p=>`<div class="row" style="${p.bankrupt?"opacity:.4":""}"><span class="sw" style="background:${p.color}"></span><span class="g">${p.token} ${esc(p.name)}<small>${tr("propsN")}: ${mineOf(p).length} · ${tr("total")}: ${money(netWorth(p))}</small></span><b data-money="p:${p.id}">${money(p.cash)}</b></div>`).join("")}
 else if(k==="debt"){h=`<h3>🧾 ${tr("mDebt")}</h3>`;let any=false;G.players.filter(p=>!p.bankrupt).forEach(p=>{const m=mineOf(p).filter(i=>G.mort[i]),cost=m.reduce((s,i)=>s+unCost(i),0);if(!m.length&&!p.jail)return;any=true;h+=`<div class="gh" style="border-color:${p.color}"><i style="background:${p.color}"></i>${p.token} ${esc(p.name)}<small data-money="p:${p.id}">${money(p.cash)}</small></div>`;if(p.jail)h+=`<div class="row">⛓️ ${tr("bailL")}</div>`;if(m.length)h+=`<div class="mcs">${m.map(miniCard).join("")}</div><div class="row"><span class="g">${tr("liftL")}</span><b>${money(cost)}</b></div>`});if(!any)h+=`<p class="muted">${tr("debtNone")}</p>`}
 else if(k==="trades"){h=`<h3>🤝 ${tr("mTrades")}</h3>`+((G.th||[]).length?G.th.slice().reverse().map(t=>`<div class="row" style="flex-direction:column;align-items:flex-start;gap:3px"><b>${esc(t.a)} ⇄ ${esc(t.b)} <small class="muted">(${tr("roundL")} ${t.r})</small></b><span style="font-weight:700;font-size:13px">↗ ${esc(t.give)}<br>↙ ${esc(t.get)}</span></div>`).join(""):`<p class="muted">${tr("noTrades2")}</p>`)}
 return h}
async function openGameSettings(){for(;;){const pr=ask(`<h3>⚙️ ${tr("settings")}</h3><div id="mset">${settingsHTML()}</div>${btns([["x","◀ "+tr("back"),"dark"]])}`,{dismiss:true,keep:true});wireSettings($("#mset"),()=>{if(UI.act)UI.act("__again")});const[a]=await pr;if(a==="__again")continue;return}}
async function openMenu(){const keep=$("#sheetBody");
 for(;;){const C=[["h","📜",tr("log")],["pp","🏠",tr("propsB")],["st","🔈",tr("stMenu")],["info","ℹ️",tr("mInfo")],["lands","🗺️",tr("mLands")],["cards","🃏",tr("mCards")],["bal","💰",tr("mBal")],["debt","🧾",tr("mDebt")],["trades","🤝",tr("mTrades")]];
  const[a]=await ask(`<h3>☰ ${tr("menuL")}</h3><div class="mgrid">${C.map((c,i)=>`<button class="mcard ${i<4?"key":""}" data-act="${c[0]}"><i>${c[1]}</i><span>${esc(c[2])}</span></button>`).join("")}</div><div class="msep"></div><div class="mbtns"><button class="btn green" data-act="x">▶ ${tr("resume")}</button><button class="btn blue" data-act="sv">💾 ${tr("saveQuit")}</button><button class="btn red" data-act="qn">🚪 ${tr("quitNo")}</button><button class="btn dark" data-act="set">⚙️ ${tr("settings")}</button></div>`,{dismiss:true});
  if(a==="x"){closeSheet();return}
  if(a==="sv"){saveGame();closeSheet();openHome();return}
  if(a==="qn"){const[c]=await ask(`<h3>🚪 ${tr("quitNo")}</h3><p>${tr("quitNoQ")}</p>${btns([["y",tr("quitNo"),"red"],["n",tr("cancel"),"dark"]])}`);if(c==="y"){try{localStorage.removeItem("tc_save")}catch(e){}closeSheet();openHome();return}continue}
  if(a==="set"){await openGameSettings();continue}
  if(a==="pp"){closeSheet();const me=G.players.find(x=>x.human&&!x.bankrupt)||G.players[G.cur];showAssets(me);return}
  if(a==="st"){closeSheet();speakStatus();return}
  if(a==="h"){await showLog();continue}
  await infoSheet(infoHTML(a))}}
const humanNow=()=>G&&!UI.open&&UI.kind&&G.players[G.cur].human?G.players[G.cur]:null;
$("#bTrade").onclick=()=>{const p=humanNow();if(p)openTrade(p)};
$("#bBuild").onclick=()=>{const p=humanNow();if(p)manage(p,0,"build")};
$("#bSell").onclick=()=>{const p=humanNow();if(p)manage(p,0,"sell")};
$("#bMort").onclick=()=>{const p=humanNow();if(p)manage(p,0,"mort")};
$("#bMic").onclick=()=>listen();
addEventListener("pointerdown",()=>{ac();unlockSpeech();if(CFG.music&&!musT)music()},{once:true});document.body.classList.toggle("acc",CFG.access);
window.__sim=async(n=4,diff="normal",opts={})=>{SIM=true;SPD=0;CFG.diff=diff;Object.assign(CFG,opts);const slots=[...Array(n)].map((_,i)=>({type:"ai",name:"AI"+i,token:TOKENS[i]}));if(G)G.dead=true;const w=await startGame(slots);const r={winner:w.name,turns:G.turns,capped:!!G.capped,cash:G.players.map(p=>Math.round(p.cash)),bk:G.players.map(p=>p.bankrupt),ts:G.ts||null,rd:G.rd,lim:!!G.limitEnd,pers:G.players.map(p=>p.pers)};SIM=false;SPD=CFG.speed;G=null;return r};
setLang(CFG.lang);openHome();
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)try{window.claude.hot.snapshot(()=>({}))}catch(e){}
</script>
